name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      # Throwaway DB for backend/nest-api src/database/schema.spec.ts (migrations vs entities)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: go24
          POSTGRES_PASSWORD: go24
          POSTGRES_DB: go24_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go24"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://go24:go24@localhost:5432/go24_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
