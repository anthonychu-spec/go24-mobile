name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Run by hand on any branch, e.g. to get a passing CI run for a SHA before a manual deploy
  workflow_dispatch:

# Scope: the backend API (backend/nest-api), which is what deploy.yml ships.
# - apps/member-app is being rewritten on the LAB app branch (Expo SDK 58, Node 22);
#   its job gets added when that branch lands. The old app here doesn't typecheck.
# - packages/* are unused scaffolds (nothing imports them) with no ESLint 9 config.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Throwaway DB for backend/nest-api src/database/schema.spec.ts (migrations vs entities)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: go24
          POSTGRES_PASSWORD: go24
          POSTGRES_DB: go24_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go24"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://go24:go24@localhost:5432/go24_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=nest-api

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=nest-api

      - name: Test (unit + migrations/schema + account deletion against Postgres)
        run: pnpm turbo run test --filter=nest-api
