name: Deploy to Droplet

# Manual only. Production deploys are approved by Anthony and started by hand
# with the exact commit to ship; nothing deploys on push.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit SHA to deploy (must have a passing CI run)'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check SHA format
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          passed=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
            --commit "$SHA" --status success --json databaseId --jq 'length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run for $SHA — refusing to deploy"
            exit 1
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          SHA: ${{ inputs.sha }}
        run: |
          ssh deploy@$DROPLET_HOST "bash -s -- $SHA" << 'EOF'
            set -euo pipefail
            SHA="$1"
            # --env-file: Compose would otherwise look for .env in infra/droplet/
            COMPOSE="docker compose --env-file /opt/go24/.env -f infra/droplet/docker-compose.prod.yml"
            cd /opt/go24
            test -f /opt/go24/.env || { echo "✗ /opt/go24/.env missing"; exit 1; }

            echo "→ checkout $SHA"
            git fetch origin
            git checkout --detach "$SHA"

            echo "→ keep current image as rollback target"
            if docker image inspect go24/nest-api:latest >/dev/null 2>&1; then
              docker image tag go24/nest-api:latest go24/nest-api:previous
            fi

            echo "→ build"
            $COMPOSE build api
            docker image tag go24/nest-api:latest "go24/nest-api:$SHA"

            echo "→ migrate (stops the deploy on failure; running API untouched)"
            $COMPOSE run --rm --no-deps api node dist/database/migrate.js

            echo "→ start new API"
            $COMPOSE up -d --no-build api

            echo "→ wait for API healthy"
            healthy=0
            for i in {1..30}; do
              if docker exec go24-api wget -q --spider http://localhost:3000/v1/health; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "✗ API not healthy after 60s — rolling back"
              if docker image inspect go24/nest-api:previous >/dev/null 2>&1; then
                docker image tag go24/nest-api:previous go24/nest-api:latest
                $COMPOSE up -d --no-build api
              fi
              exit 1
            fi

            echo "✓ API healthy on $SHA"
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed — check logs above and on droplet"
